    <title>AETHER ENGINE | v2.1 Hardened</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #00ffcc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; text-shadow: 0 0 10px #00ffcc; }

        .row { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; }
        .val { color: white; font-weight: bold; }

        #hint { position: absolute; bottom: 16px; left: 20px; font-size: 11px; opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body>
    <div id="loading">Initializing Hardened Kernel…</div>
    <div id="ui">
        <div class="stat-box">
            <div style="font-weight: bold; border-bottom: 1px solid #00ffcc; margin-bottom: 8px;">AETHER ENGINE v2.1 (HARDENED)</div>
            <div class="row"><span>FPS:</span> <span id="fps" class="val">0</span></div>
            <div class="row"><span>ENTITIES:</span> <span id="ent" class="val">0</span></div>
            <div class="row"><span>AWAKE:</span> <span id="awake" class="val">0</span></div>
            <div class="row"><span>PHYS-CHECKS:</span> <span id="checks" class="val">0</span></div>
            <div class="row"><span>GRID-CELLS:</span> <span id="cells" class="val">0</span></div>
            <div class="row"><span>SUBSTEPS:</span> <span id="subs" class="val">0</span></div>
        </div>
    </div>
    <div id="hint">WASD move · Space jump · Orbit drag camera</div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ====================================================================
        // VECTOR POOL — zero GC in the hot path
        // ====================================================================
        const Pool = {
            v1: new THREE.Vector3(), v2: new THREE.Vector3(), v3: new THREE.Vector3(),
            v4: new THREE.Vector3(), v5: new THREE.Vector3(), v6: new THREE.Vector3(),
            v7: new THREE.Vector3(), v8: new THREE.Vector3()
        };

        // ====================================================================
        // SPATIAL HASH — multi-cell insert for large AABBs + 3×3×3 query
        // ====================================================================
        class SpatialHash {
            constructor(cellSize = 2) {
                this.cellSize = cellSize;
                this.grid = new Map();
            }
            key(x, y, z) { return x + ',' + y + ',' + z; }
            clear() { this.grid.clear(); }
            _push(k, entity) {
                let cell = this.grid.get(k);
                if (!cell) { cell = []; this.grid.set(k, cell); }
                cell.push(entity);
            }
            // Insert into every cell the body's AABB overlaps
            insert(entity) {
                const p = entity.mesh.position;
                const ph = entity.physics;
                let minX, minY, minZ, maxX, maxY, maxZ;
                if (ph.shape === 'box') {
                    const hx = ph.hx, hy = ph.hy, hz = ph.hz;
                    minX = p.x - hx; maxX = p.x + hx;
                    minY = p.y - hy; maxY = p.y + hy;
                    minZ = p.z - hz; maxZ = p.z + hz;
                } else {
                    const r = ph.radius || 0.5;
                    minX = p.x - r; maxX = p.x + r;
                    minY = p.y - r; maxY = p.y + r;
                    minZ = p.z - r; maxZ = p.z + r;
                }
                const cs = this.cellSize;
                const x0 = Math.floor(minX / cs), x1 = Math.floor(maxX / cs);
                const y0 = Math.floor(minY / cs), y1 = Math.floor(maxY / cs);
                const z0 = Math.floor(minZ / cs), z1 = Math.floor(maxZ / cs);
                for (let x = x0; x <= x1; x++)
                    for (let y = y0; y <= y1; y++)
                        for (let z = z0; z <= z1; z++)
                            this._push(this.key(x, y, z), entity);
            }
            getNearby(entity) {
                const p = entity.mesh.position;
                const ph = entity.physics;
                let minX, minY, minZ, maxX, maxY, maxZ;
                if (ph.shape === 'box') {
                    minX = p.x - ph.hx; maxX = p.x + ph.hx;
                    minY = p.y - ph.hy; maxY = p.y + ph.hy;
                    minZ = p.z - ph.hz; maxZ = p.z + ph.hz;
                } else {
                    const r = ph.radius || 0.5;
                    minX = p.x - r; maxX = p.x + r;
                    minY = p.y - r; maxY = p.y + r;
                    minZ = p.z - r; maxZ = p.z + r;
                }
                const cs = this.cellSize;
                // Expand by one cell so border pairs aren't missed
                const x0 = Math.floor(minX / cs) - 1, x1 = Math.floor(maxX / cs) + 1;
                const y0 = Math.floor(minY / cs) - 1, y1 = Math.floor(maxY / cs) + 1;
                const z0 = Math.floor(minZ / cs) - 1, z1 = Math.floor(maxZ / cs) + 1;
                const result = [];
                const seen = new Set();
                for (let x = x0; x <= x1; x++)
                    for (let y = y0; y <= y1; y++)
                        for (let z = z0; z <= z1; z++) {
                            const cell = this.grid.get(this.key(x, y, z));
                            if (!cell) continue;
                            for (let i = 0; i < cell.length; i++) {
                                const e = cell[i];
                                if (seen.has(e.mesh.id)) continue;
                                seen.add(e.mesh.id);
                                result.push(e);
                            }
                        }
                return result;
            }
            getCellCount() { return this.grid.size; }
        }

        // ====================================================================
        // SHAPE HELPERS (allocation-free via Pool)
        // Returns true if contact; writes normal (A←B direction? A away from B)
        // normal points from B toward A, pen > 0, contact point unused
        // ====================================================================
        function invMassOf(ph) {
            if (ph.isStatic || !isFinite(ph.mass) || ph.mass <= 0) return 0;
            return 1 / ph.mass;
        }

        // Closest point on AABB (center c, half-extents h) to point p → out
        function closestOnAABB(px, py, pz, cx, cy, cz, hx, hy, hz, out) {
            out.x = Math.max(cx - hx, Math.min(px, cx + hx));
            out.y = Math.max(cy - hy, Math.min(py, cy + hy));
            out.z = Math.max(cz - hz, Math.min(pz, cz + hz));
        }

        /**
         * Contact query. On hit: Pool.v1 = unit normal (from B → A), returns pen depth.
         * Returns 0 if no contact.
         */
        function contact(a, b) {
            const pa = a.mesh.position, pb = b.mesh.position;
            const A = a.physics, B = b.physics;
            const sa = A.shape || 'sphere', sb = B.shape || 'sphere';

            // ---- sphere–sphere ----
            if (sa === 'sphere' && sb === 'sphere') {
                Pool.v1.subVectors(pa, pb);
                const distSq = Pool.v1.lengthSq();
                const minD = (A.radius || 0.5) + (B.radius || 0.5);
                if (distSq >= minD * minD) return 0;
                let dist = Math.sqrt(distSq);
                if (dist < 1e-8) { Pool.v1.set(0, 1, 0); dist = 1e-8; }
                else Pool.v1.multiplyScalar(1 / dist);
                return minD - dist;
            }

            // ---- box–box (AABB) ----
            if (sa === 'box' && sb === 'box') {
                const dx = pa.x - pb.x, dy = pa.y - pb.y, dz = pa.z - pb.z;
                const ox = (A.hx + B.hx) - Math.abs(dx);
                const oy = (A.hy + B.hy) - Math.abs(dy);
                const oz = (A.hz + B.hz) - Math.abs(dz);
                if (ox <= 0 || oy <= 0 || oz <= 0) return 0;
                // Minimum penetration axis
                if (ox <= oy && ox <= oz) {
                    Pool.v1.set(dx < 0 ? -1 : 1, 0, 0);
                    return ox;
                }
                if (oy <= ox && oy <= oz) {
                    Pool.v1.set(0, dy < 0 ? -1 : 1, 0);
                    return oy;
                }
                Pool.v1.set(0, 0, dz < 0 ? -1 : 1);
                return oz;
            }

            // ---- sphere–box (order-normalized) ----
            let sphere = a, box = b, flip = false;
            if (sa === 'box' && sb === 'sphere') { sphere = b; box = a; flip = true; }
            else if (!(sa === 'sphere' && sb === 'box')) return 0;

            const sp = sphere.mesh.position;
            const bp = box.mesh.position;
            const bx = box.physics;
            const r = sphere.physics.radius || 0.5;
            const inside =
                Math.abs(sp.x - bp.x) <= bx.hx &&
                Math.abs(sp.y - bp.y) <= bx.hy &&
                Math.abs(sp.z - bp.z) <= bx.hz;

            let pen;
            if (inside) {
                const dx = bx.hx - Math.abs(sp.x - bp.x);
                const dy = bx.hy - Math.abs(sp.y - bp.y);
                const dz = bx.hz - Math.abs(sp.z - bp.z);
                if (dx <= dy && dx <= dz) {
                    Pool.v1.set(sp.x >= bp.x ? 1 : -1, 0, 0);
                    pen = dx + r;
                } else if (dy <= dx && dy <= dz) {
                    Pool.v1.set(0, sp.y >= bp.y ? 1 : -1, 0);
                    pen = dy + r;
                } else {
                    Pool.v1.set(0, 0, sp.z >= bp.z ? 1 : -1);
                    pen = dz + r;
                }
            } else {
                closestOnAABB(sp.x, sp.y, sp.z, bp.x, bp.y, bp.z, bx.hx, bx.hy, bx.hz, Pool.v2);
                Pool.v1.subVectors(sp, Pool.v2);
                const distSq = Pool.v1.lengthSq();
                if (distSq >= r * r) return 0;
                if (distSq < 1e-12) {
                    Pool.v1.set(0, 1, 0);
                    pen = r;
                } else {
                    const dist = Math.sqrt(distSq);
                    Pool.v1.multiplyScalar(1 / dist);
                    pen = r - dist;
                }
            }
            // Normal must point from B toward A (first arg of resolve)
            if (flip) Pool.v1.negate();
            return pen;
        }

        // ====================================================================
        // HARDENED PHYSICS KERNEL
        //  · fixed substep (engine drives)
        //  · sphere + AABB
        //  · friction
        //  · sleep / wake
        // ====================================================================
        class PhysicsKernel {
            constructor() {
                this.gravity = new THREE.Vector3(0, -18, 0);
                this.bodies = [];
                this.hash = new SpatialHash(2);
                this.checkCount = 0;
                this.awakeCount = 0;
                this.linearDamp = 0.08;          // light air drag
                this.sleepVel = 0.08;            // |v| below this starts sleep clock
                this.sleepTime = 0.45;           // seconds still → sleep
                this.wakeImpulse = 0.15;
                this.baums = 0.28;               // position correction fraction
                this.slop = 0.008;
            }
            addBody(entity) {
                const ph = entity.physics;
                if (!ph.vel) ph.vel = new THREE.Vector3();
                if (ph.sleepTimer == null) ph.sleepTimer = 0;
                if (ph.sleeping == null) ph.sleeping = false;
                if (ph.grounded == null) ph.grounded = false;
                if (ph.friction == null) ph.friction = 0.45;
                if (ph.bounce == null) ph.bounce = 0.25;
                if (!ph.shape) ph.shape = ph.hx != null ? 'box' : 'sphere';
                if (ph.shape === 'sphere' && ph.radius == null) ph.radius = 0.5;
                if (ph.shape === 'box') {
                    if (ph.hx == null) ph.hx = 0.3;
                    if (ph.hy == null) ph.hy = 0.3;
                    if (ph.hz == null) ph.hz = 0.3;
                }
                this.bodies.push(entity);
            }
            wake(ph, force) {
                if (ph.isStatic) return;
                if (force || ph.sleeping) {
                    ph.sleeping = false;
                    ph.sleepTimer = 0;
                }
            }
            step(dt) {
                this.checkCount = 0;
                this.hash.clear();
                this.awakeCount = 0;

                // Clear grounded flags; set during resolve
                for (let i = 0; i < this.bodies.length; i++) {
                    const ph = this.bodies[i].physics;
                    ph.grounded = false;
                }

                // 1. Integrate awake dynamics + insert all (static + sleeping still occupy space)
                for (let i = 0; i < this.bodies.length; i++) {
                    const b = this.bodies[i];
                    const ph = b.physics;
                    if (!ph.isStatic && !ph.sleeping) {
                        this.awakeCount++;
                        // Gravity
                        ph.vel.y += this.gravity.y * dt;
                        // Light linear damping (frame-rate independent-ish via small *dt)
                        const damp = Math.max(0, 1 - this.linearDamp * dt);
                        ph.vel.x *= damp;
                        ph.vel.z *= damp;
                        // Integrate
                        b.mesh.position.x += ph.vel.x * dt;
                        b.mesh.position.y += ph.vel.y * dt;
                        b.mesh.position.z += ph.vel.z * dt;

                        // Sleep clock
                        const sp2 = ph.vel.lengthSq();
                        if (sp2 < this.sleepVel * this.sleepVel) {
                            ph.sleepTimer += dt;
                            if (ph.sleepTimer >= this.sleepTime) {
                                ph.sleeping = true;
                                ph.vel.set(0, 0, 0);
                                ph.sleepTimer = 0;
                            }
                        } else {
                            ph.sleepTimer = 0;
                        }
                    } else if (!ph.isStatic && ph.sleeping) {
                        // sleeping bodies still fill the hash
                    } else if (ph.isStatic) {
                        // static
                    }
                    this.hash.insert(b);
                }

                // 2. Collisions — skip pairs that are both static or both sleeping
                for (let i = 0; i < this.bodies.length; i++) {
                    const a = this.bodies[i];
                    const nearby = this.hash.getNearby(a);
                    for (let j = 0; j < nearby.length; j++) {
                        const b = nearby[j];
                        if (a === b || a.mesh.id > b.mesh.id) continue;
                        const pa = a.physics, pb = b.physics;
                        if (pa.isStatic && pb.isStatic) continue;
                        if (pa.sleeping && pb.sleeping) continue;
                        if (pa.sleeping && pb.isStatic) continue;
                        if (pb.sleeping && pa.isStatic) continue;
                        this.checkCount++;
                        this.resolve(a, b);
                    }
                }
            }
            resolve(a, b) {
                const pen = contact(a, b);
                if (pen <= 0) return;
                // Pool.v1 = normal from B → A

                const pa = a.physics, pb = b.physics;
                const invA = invMassOf(pa), invB = invMassOf(pb);
                const invSum = invA + invB;
                if (invSum === 0) return;

                // Wake sleepers on meaningful contact
                const relN = Pool.v2.subVectors(pa.vel, pb.vel).dot(Pool.v1);
                if (Math.abs(relN) > this.wakeImpulse || pen > 0.02) {
                    this.wake(pa, true);
                    this.wake(pb, true);
                }

                // Separating → only correct deep penetration lightly
                if (relN > 0.01) {
                    // still allow position correction below
                } else {
                    const bounce = Math.min(pa.bounce ?? 0.25, pb.bounce ?? 0.25);
                    // Soften bounce when nearly resting
                    const e = Math.abs(relN) < 0.4 ? bounce * 0.35 : bounce;
                    const j = -(1 + e) * relN / invSum;
                    Pool.v3.copy(Pool.v1).multiplyScalar(j);
                    if (invA > 0) pa.vel.addScaledVector(Pool.v3, invA);
                    if (invB > 0) pb.vel.addScaledVector(Pool.v3, -invB);

                    // Coulomb friction on tangent
                    Pool.v2.subVectors(pa.vel, pb.vel);
                    const vn = Pool.v2.dot(Pool.v1);
                    Pool.v4.copy(Pool.v1).multiplyScalar(vn);
                    Pool.v5.subVectors(Pool.v2, Pool.v4); // tangent vel
                    const tLen = Pool.v5.length();
                    if (tLen > 1e-5) {
                        Pool.v5.multiplyScalar(1 / tLen);
                        const mu = Math.sqrt((pa.friction ?? 0.45) * (pb.friction ?? 0.45));
                        let jt = -tLen / invSum;
                        const maxF = Math.abs(j) * mu;
                        jt = Math.max(-maxF, Math.min(maxF, jt));
                        Pool.v6.copy(Pool.v5).multiplyScalar(jt);
                        if (invA > 0) pa.vel.addScaledVector(Pool.v6, invA);
                        if (invB > 0) pb.vel.addScaledVector(Pool.v6, -invB);
                    }
                }

                // Position correction
                if (pen > this.slop) {
                    const corrMag = (pen - this.slop) * this.baums / invSum;
                    if (invA > 0) a.mesh.position.addScaledVector(Pool.v1, corrMag * invA);
                    if (invB > 0) b.mesh.position.addScaledVector(Pool.v1, -corrMag * invB);
                }

                // Grounded if normal has upward support for the body being pushed up
                if (Pool.v1.y > 0.45 && invA > 0) pa.grounded = true;
                if (Pool.v1.y < -0.45 && invB > 0) pb.grounded = true;
            }
        }

        // ====================================================================
        // ENGINE — fixed timestep + smoothed FPS
        // ====================================================================
        class AetherEngine {
            constructor() {
                this.physics = new PhysicsKernel();
                this.entities = [];
                this.clock = new THREE.Clock();
                this.input = { keys: {} };
                this.fixedDt = 1 / 60;
                this.acc = 0;
                this.maxSubsteps = 5;
                this.lastSubs = 0;
                this.fpsSmooth = 60;
                this.init();
            }
            async init() {
                window.addEventListener('keydown', e => {
                    this.input.keys[e.code] = true;
                    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code))
                        e.preventDefault();
                });
                window.addEventListener('keyup', e => { this.input.keys[e.code] = false; });
                window.addEventListener('blur', () => { this.input.keys = {}; });
                this.setupGraphics();
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    const el = document.getElementById('loading');
                    if (el) el.remove();
                }, 500);
                this.loop();
            }
            setupGraphics() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x010103);
                this.scene.fog = new THREE.FogExp2(0x010103, 0.035);
                this.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
                this.camera.position.set(18, 14, 18);
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                document.body.appendChild(this.renderer.domElement);
                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.target.set(0, 2, 0);
                const sun = new THREE.DirectionalLight(0xffffff, 2);
                sun.position.set(20, 40, 20);
                sun.castShadow = true;
                sun.shadow.mapSize.set(1024, 1024);
                sun.shadow.camera.near = 1;
                sun.shadow.camera.far = 80;
                sun.shadow.camera.left = -30;
                sun.shadow.camera.right = 30;
                sun.shadow.camera.top = 30;
                sun.shadow.camera.bottom = -30;
                this.scene.add(sun, new THREE.AmbientLight(0x404040, 1));
            }
            createEntity({ mesh, physics = null, behavior = null }) {
                const entity = {
                    mesh,
                    physics: physics || {
                        vel: new THREE.Vector3(), mass: 1, bounce: 0.25,
                        shape: 'sphere', radius: 0.5, isStatic: false, friction: 0.45
                    },
                    behavior: behavior || (() => {})
                };
                if (!entity.physics.vel) entity.physics.vel = new THREE.Vector3();
                this.physics.addBody(entity);
                this.scene.add(mesh);
                this.entities.push(entity);
                return entity;
            }
            loop() {
                requestAnimationFrame(() => this.loop());
                const frameDt = Math.min(this.clock.getDelta(), 0.05);
                this.fpsSmooth = this.fpsSmooth * 0.9 + (1 / Math.max(frameDt, 1e-4)) * 0.1;

                // Fixed-step physics
                this.acc += frameDt;
                let steps = 0;
                while (this.acc >= this.fixedDt && steps < this.maxSubsteps) {
                    this.physics.step(this.fixedDt);
                    // Behaviors at physics rate so movement is deterministic
                    for (let i = 0; i < this.entities.length; i++) {
                        const ent = this.entities[i];
                        ent.behavior(ent, this.fixedDt, this);
                    }
                    this.acc -= this.fixedDt;
                    steps++;
                }
                // Spill leftover time so we don't spiral after a hitch
                if (steps === this.maxSubsteps) this.acc = 0;
                this.lastSubs = steps;

                this.controls.update();
                this.renderer.render(this.scene, this.camera);

                document.getElementById('fps').innerText = Math.round(this.fpsSmooth);
                document.getElementById('ent').innerText = this.entities.length;
                document.getElementById('awake').innerText = this.physics.awakeCount;
                document.getElementById('checks').innerText = this.physics.checkCount;
                document.getElementById('cells').innerText = this.physics.hash.getCellCount();
                document.getElementById('subs').innerText = this.lastSubs;
            }
        }

        // ====================================================================
        // SCENE
        // ====================================================================
        const Engine = new AetherEngine();

        // Flat ground — true AABB box (not a giant sphere). Stacking is honest.
        const ground = Engine.createEntity({
            mesh: new THREE.Mesh(
                new THREE.BoxGeometry(80, 1, 80),
                new THREE.MeshStandardMaterial({ color: 0x0c0c10, roughness: 0.85, metalness: 0.1 })
            ),
            physics: {
                vel: new THREE.Vector3(), mass: Infinity, bounce: 0.05,
                shape: 'box', hx: 40, hy: 0.5, hz: 40,
                isStatic: true, friction: 0.7
            }
        });
        ground.mesh.position.set(0, -0.5, 0);
        ground.mesh.receiveShadow = true;

        // Player sphere with grounded jump
        const player = Engine.createEntity({
            mesh: new THREE.Mesh(
                new THREE.SphereGeometry(0.45, 24, 16),
                new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.45 })
            ),
            physics: {
                vel: new THREE.Vector3(), mass: 1.2, bounce: 0.05,
                shape: 'sphere', radius: 0.45, isStatic: false, friction: 0.55
            },
            behavior: (self, dt, eng) => {
                // Keep player awake while controlling
                eng.physics.wake(self.physics, true);
                const accel = 42;
                if (eng.input.keys['KeyW']) self.physics.vel.z -= accel * dt;
                if (eng.input.keys['KeyS']) self.physics.vel.z += accel * dt;
                if (eng.input.keys['KeyA']) self.physics.vel.x -= accel * dt;
                if (eng.input.keys['KeyD']) self.physics.vel.x += accel * dt;
                // Grounded jump from contact normal, not a magic y threshold
                if (eng.input.keys['Space'] && self.physics.grounded) {
                    self.physics.vel.y = 7.5;
                    self.physics.grounded = false;
                }
                // Horizontal speed clamp
                const hx = self.physics.vel.x, hz = self.physics.vel.z;
                const hSp = Math.hypot(hx, hz);
                const maxH = 12;
                if (hSp > maxH) {
                    self.physics.vel.x *= maxH / hSp;
                    self.physics.vel.z *= maxH / hSp;
                }
            }
        });
        player.mesh.position.set(0, 3, 0);
        player.mesh.castShadow = true;

        // 500 true AABB cubes (physics matches mesh half-extents)
        const boxSize = 0.6;
        const half = boxSize * 0.5;
        for (let i = 0; i < 500; i++) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(boxSize, boxSize, boxSize),
                new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(Math.random(), 0.55, 0.5),
                    roughness: 0.55
                })
            );
            mesh.castShadow = true;
            mesh.position.set(
                Math.random() * 24 - 12,
                1.5 + Math.random() * 28,
                Math.random() * 24 - 12
            );
            Engine.createEntity({
                mesh,
                physics: {
                    vel: new THREE.Vector3(),
                    mass: 0.8 + Math.random() * 0.6,
                    bounce: 0.12 + Math.random() * 0.15,
                    shape: 'box',
                    hx: half, hy: half, hz: half,
                    isStatic: false,
                    friction: 0.5 + Math.random() * 0.25
                }
            });
        }

        // A few heavy static pillars for the pile to interact with
        for (const [x, z] of [[-6, -6], [6, 6], [-6, 6], [6, -6]]) {
            const pillar = Engine.createEntity({
                mesh: new THREE.Mesh(
                    new THREE.BoxGeometry(1.2, 3, 1.2),
                    new THREE.MeshStandardMaterial({ color: 0x222830 })
                ),
                physics: {
                    vel: new THREE.Vector3(), mass: Infinity, bounce: 0.1,
                    shape: 'box', hx: 0.6, hy: 1.5, hz: 0.6,
                    isStatic: true, friction: 0.65
                }
            });
            pillar.mesh.position.set(x, 1.5, z);
            pillar.mesh.castShadow = true;
            pillar.mesh.receiveShadow = true;
        }

        window.addEventListener('resize', () => {
            Engine.camera.aspect = window.innerWidth / window.innerHeight;
            Engine.camera.updateProjectionMatrix();
            Engine.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
